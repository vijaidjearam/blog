title: Snippets
description: Just aim you can hit it!
author: Vijai
baseurl: /blog
timezone: Europe/Paris

github_username: vijaidjearam   # no @ symbol

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "default"   # options: air, contrast, dark, dirt, neon, mint, plum, sunrise

show_excerpts: true
show_tags: true
future: true

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jemoji
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

paginate: 10
paginate_path: /page:num/

# THIS is the key missing piece — without defaults, Minimal Mistakes
# won't apply "single" layout styling, sidebar, TOC, etc. properly
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      toc: true
      toc_sticky: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true